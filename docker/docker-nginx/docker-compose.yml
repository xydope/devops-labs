services:
  nginx:
    build: .
    container_name: docker-nginx
    ports:
      - "8080:80"
    networks:
      - appnet
    depends_on:
      - backend
    # Optional bind mounts for live config/HTML edits during learning:
    # volumes:
    #   - ./html:/usr/share/nginx/html:ro
    #   - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  backend:
    build: ./backend
    container_name: docker-nginx-backend
    # Port 3000 stays internal — only reachable via the Docker network.
    # Uncomment to debug the backend directly from the host:
    # ports:
    #   - "3000:3000"
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
    name: docker-nginx-net
